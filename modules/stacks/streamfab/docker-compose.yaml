name: streamfab

services:
  streamfab:
    container_name: streamfab
    environment:
      TZ: Europe/Berlin
      USER_ID: "1000"
      GROUP_ID: "1000"
      KEEP_APP_RUNNING: "1"
      # Cloudflare Access (Google) is the only login: no API key for
      # StreamFab.Manager's web UI and API, no password for noVNC. Set here
      # as `environment` wins over the env_file.
      FAB_API_KEY: ""
      VNC_PASSWORD: ""
      # Jellyfin to scan after filing a download (with FAB_JELLYFIN_API_KEY)
      FAB_JELLYFIN_URL: https://jellyfin.welles.app
      # Jellyseerr (jellyfin stack), whose approved requests the manager's
      # Requests page lists (with FAB_JELLYSEERR_API_KEY)
      FAB_JELLYSEERR_URL: https://requests.jellyfin.welles.app
    # FAB_TMDB_TOKEN for the title search (the token of search-tmdb's
    # tmdb-api-token) and FAB_JELLYSEERR_API_KEY (Jellyseerr → Settings →
    # General); optional FAB_JELLYFIN_API_KEY (Jellyfin → Dashboard → API
    # Keys) and MACHINE_ID
    env_file:
      - /run/secrets/streamfab
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5810/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start downloads and installs StreamFab into the Wine prefix
      start_period: 120s
    # StreamFab itself is installed into /config and updates itself there; the
    # image (Wine and the manager, whose database has migrations) is pinned
    image: ghcr.io/welles/streamfab:sha-3d16269
    networks:
      streamfab:
        ipv4_address: 10.10.21.10
    ports:
      # No VNC port: without a password it would be open to the LAN. StreamFab
      # is reached through the manager's noVNC (/program) instead.
      # Only for the host's cloudflared (Cloudflare Tunnel behind Access), as
      # Docker's published ports bypass the host firewall:
      # StreamFab.Manager (web UI + REST API; shows StreamFab itself under /program)
      - 127.0.0.1:50211:5810/tcp
    restart: unless-stopped
    # Embedded Chromium
    shm_size: 1gb
    stop_grace_period: 2m
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Wine prefix with StreamFab, logins, settings, machine-id and the manager's database
      - /mnt/bucket/streamfab/config:/config:rw
      # Wine drive O:, YouTube goes into /output/YouTube
      - /mnt/tank/downloads:/output:rw
      # Jellyfin's libraries: StreamFab.Manager files finished downloads there
      - /mnt/tank/movies:/media/movies:rw
      - /mnt/tank/shows:/media/shows:rw

networks:
  streamfab:
    name: streamfab
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 10.10.21.0/24
