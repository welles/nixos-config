name: streamfab

services:
  streamfab:
    container_name: streamfab
    environment:
      TZ: Europe/Berlin
      USER_ID: "1000"
      GROUP_ID: "1000"
      KEEP_APP_RUNNING: "1"
    # VNC_PASSWORD and FAB_API_KEY (API key of StreamFab.Manager); optional MACHINE_ID
    env_file:
      - /run/secrets/streamfab
    healthcheck:
      # StreamFab.Manager answers /health without the API key
      test: ["CMD-SHELL", "curl -f http://localhost:5810/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      # The first start downloads and installs StreamFab into the Wine prefix
      start_period: 120s
    # StreamFab ships its own software into /config and updates itself there
    image: ghcr.io/welles/streamfab:latest
    networks:
      streamfab:
        ipv4_address: 10.10.21.10
    ports:
      # VNC
      - 50210:5900/tcp
      # Only for the host's cloudflared (Cloudflare Tunnel behind Access), as
      # Docker's published ports bypass the host firewall:
      # StreamFab.Manager (web UI + REST API)
      - 127.0.0.1:50211:5810/tcp
      # noVNC web UI of StreamFab itself
      - 127.0.0.1:50212:5800/tcp
    restart: unless-stopped
    # Embedded Chromium
    shm_size: 1gb
    stop_grace_period: 2m
    volumes:
      - /etc/localtime:/etc/localtime:ro
      # Wine prefix with StreamFab, logins, settings, machine-id and the manager's database
      - /mnt/bucket/streamfab/config:/config:rw
      # Wine drive O:, YouTube goes into /output/YouTube
      - /mnt/tank/downloads:/output:rw

networks:
  streamfab:
    name: streamfab
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 10.10.21.0/24
