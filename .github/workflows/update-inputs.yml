name: Update Flake Inputs

concurrency:
  group: nix-flake
  cancel-in-progress: false

on:
  schedule:
    # Cron is UTC (01:17 UTC = 02:17 CET / 03:17 CEST). Runs at the top of
    # the hour get delayed by hours on GitHub's shared scheduler, so use an
    # off-peak minute.
    - cron: "17 1 * * *"
  workflow_dispatch:

jobs:
  update-and-setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      changed: ${{ steps.check-changes.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install nix
        uses: cachix/install-nix-action@v31

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: welles-nixos-config
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Update flake inputs
        run: nix flake update

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes in flake.lock. Stopping early."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "flake.lock updated. Proceeding with checks."
          fi

      - name: Run nix flake check
        if: steps.check-changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        run: nix flake check

      - name: Generate host matrix
        if: steps.check-changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        id: set-matrix
        run: |
          HOSTS=$(nix eval .#nixosConfigurations --apply builtins.attrNames --json)
          echo "matrix=$HOSTS" >> $GITHUB_OUTPUT

      - name: Upload updated flake.lock
        if: steps.check-changes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: flake-lock
          path: flake.lock
          retention-days: 1

  evaluate:
    needs: update-and-setup
    if: needs.update-and-setup.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.update-and-setup.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download updated flake.lock
        uses: actions/download-artifact@v8
        with:
          name: flake-lock
          path: .

      - name: Install nix
        uses: cachix/install-nix-action@v31

      - name: Set up Cachix
        uses: cachix/cachix-action@v17
        with:
          name: welles-nixos-config
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build NixOS Configuration (${{ matrix.host }})
        env:
          HOST: ${{ matrix.host }}
        run: |
          set -o pipefail
          if ! nix build ".#nixosConfigurations.\"$HOST\".config.system.build.toplevel" 2>&1 | tee build.log; then
            # The Cachix post step floods the log, so surface the error as an
            # annotation and in the job summary.
            {
              echo "### Build of \`$HOST\` failed"
              echo '```'
              tail -n 80 build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            msg=$(tail -n 30 build.log)
            msg=${msg//'%'/'%25'}
            msg=${msg//$'\r'/'%0D'}
            msg=${msg//$'\n'/'%0A'}
            echo "::error title=Build of $HOST failed::$msg"
            exit 1
          fi

  commit-update:
    needs: [update-and-setup, evaluate]
    if: needs.update-and-setup.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download updated flake.lock
        uses: actions/download-artifact@v8
        with:
          name: flake-lock
          path: .

      - name: Commit and push changes
        uses: planetscale/ghcommit-action@v0.2.22
        with:
          commit_message: "Update flake lock file"
          repo: ${{ github.repository }}
          branch: ${{ github.ref_name }}
          file_pattern: "flake.lock"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
